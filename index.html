<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>跳转到抖音</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #111;
      color: #fff;
      cursor: pointer;
      text-align: center;
    }

    main {
      padding: 2rem;
    }

    .button {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.9rem 1.4rem;
      border-radius: 999px;
      background: #fe2c55;
      color: #fff;
      font-weight: 700;
      user-select: none;
    }
  </style>
</head>
<body>
  <main aria-label="点击页面跳转到抖音">
    <h1>点击跳转到抖音</h1>
    <p>本页面只会在点击后跳转到抖音官网。</p>
    <span class="button">打开抖音</span>
  </main>

  <script>
    const douyinUrl = 'https://www.douyin.com/';

    document.addEventListener('click', () => {
      window.location.assign(douyinUrl);
    });
  </script>
</body>
</html>
