<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>打开抖音 App</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #111;
      color: #fff;
      cursor: pointer;
      text-align: center;
    }

    main {
      padding: 2rem;
    }

    .button {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.9rem 1.4rem;
      border-radius: 999px;
      background: #fe2c55;
      color: #fff;
      font-weight: 700;
      user-select: none;
    }

    .hint {
      margin-top: 1rem;
      color: #bbb;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <main aria-label="点击页面打开抖音 App">
    <h1>点击打开抖音 App</h1>
    <p>本页面只会尝试唤起抖音 App，不会跳转到任何其他页面或抖音网站版。</p>
    <span class="button">打开抖音 App</span>
    <p class="hint" id="hint" role="status" aria-live="polite"></p>
  </main>

  <script>
    const douyinAppUrl = 'snssdk1128://';
    const hint = document.getElementById('hint');

    document.addEventListener('click', () => {
      hint.textContent = '正在尝试打开抖音 App。如果没有反应，请确认已安装抖音。';
      window.location.href = douyinAppUrl;
    });
  </script>
</body>
</html>
