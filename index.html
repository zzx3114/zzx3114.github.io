<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>打开抖音 App</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #111;
      color: #fff;
      text-align: center;
    }

    main {
      padding: 2rem;
    }

    .status {
      margin-top: 1rem;
      color: #bbb;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <main aria-label="自动打开抖音 App">
    <h1>正在打开抖音 App</h1>
    <p>本页面只会尝试唤起抖音 App，不会跳转到任何其他页面或抖音网站版。</p>
    <p class="status" role="status" aria-live="polite">如果没有反应，请确认已安装抖音。</p>
  </main>

  <script>
    const douyinAppUrl = 'snssdk1128://';

    function openDouyinApp() {
      window.location.href = douyinAppUrl;
    }

    window.addEventListener('DOMContentLoaded', openDouyinApp, { once: true });
  </script>
</body>
</html>
